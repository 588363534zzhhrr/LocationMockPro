<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Interactive Map Pro</title>
  <link rel="stylesheet" href="file:///android_asset/leaflet/leaflet.css" />
  <script src="file:///android_asset/leaflet/leaflet.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #map {
      height: 100%;
      width: 100%;
      background: #e5e3df;
    }

    /* Top Search Container & Autocomplete Dropdown */
    .search-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      width: calc(100% - 130px);
      max-width: 320px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.22);
      padding: 3px 6px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0,0,0,0.08);
      position: relative;
    }
    .search-input {
      border: none;
      outline: none;
      font-size: 13px;
      padding: 6px 6px;
      flex: 1;
      min-width: 0;
      background: transparent;
      color: #222;
      font-weight: 500;
    }
    .search-input::placeholder {
      color: #999;
      font-size: 12px;
    }
    .search-clear-btn {
      background: transparent;
      border: none;
      color: #999;
      font-size: 13px;
      padding: 4px 6px;
      cursor: pointer;
      line-height: 1;
    }
    .search-clear-btn:active {
      color: #333;
    }
    .search-btn {
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .search-btn:active {
      background: #1565C0;
    }
    .search-cfg-btn {
      background: transparent;
      border: none;
      font-size: 14px;
      padding: 4px 4px;
      cursor: pointer;
      color: #666;
      line-height: 1;
    }

    /* Search Results Dropdown Panel */
    .search-results-panel {
      position: absolute;
      top: 44px;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      border: 1px solid rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      overflow: hidden;
      max-height: 320px;
      display: flex;
      flex-direction: column;
      z-index: 1001;
      animation: fadeInDown 0.2s ease-out;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .search-results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      background: #f7f9fa;
      border-bottom: 1px solid #ebebeb;
      font-size: 11px;
      color: #666;
      font-weight: 600;
    }
    .close-results-btn {
      background: transparent;
      border: none;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 4px;
    }
    .search-results-list {
      overflow-y: auto;
      max-height: 270px;
      -webkit-overflow-scrolling: touch;
    }
    .search-item {
      padding: 9px 10px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-item:active {
      background: #eef5fc;
    }
    .search-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .search-item-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-item-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      margin-left: 6px;
    }
    .badge-preset { background: #E8F5E9; color: #2E7D32; border: 1px solid #C8E6C9; }
    .badge-amap { background: #FFF3E0; color: #E65100; border: 1px solid #FFE0B2; }
    .badge-online { background: #E3F2FD; color: #1565C0; border: 1px solid #BBDEFB; }
    .badge-coord { background: #EDE7F6; color: #512DA8; border: 1px solid #D1C4E9; }

    .search-item-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #777;
    }
    .search-item-addr {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }
    .search-item-dist {
      color: #999;
      font-size: 10px;
      white-space: nowrap;
    }
    .search-empty {
      padding: 18px 12px;
      text-align: center;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    /* Modal for AMap Web Key */
    .api-key-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      backdrop-filter: blur(2px);
    }
    .modal-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .modal-title {
      font-size: 14px;
      font-weight: bold;
      color: #222;
      margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 11px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .modal-input {
      width: 100%;
      padding: 8px 10px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      margin-bottom: 14px;
    }
    .modal-input:focus {
      border-color: #1976D2;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .modal-btn-cancel {
      background: #f0f0f0;
      color: #444;
    }
    .modal-btn-save {
      background: #1976D2;
      color: white;
    }

    /* Search Target Pin */
    .search-target-pin {
      width: 34px;
      height: 34px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .search-target-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(25, 118, 210, 0.45);
      animation: targetPulse 1.6s infinite ease-out;
    }
    @keyframes targetPulse {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .search-target-center {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #1976D2;
      color: white;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      border: 2px solid #ffffff;
      z-index: 2;
    }
    .search-action-btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .search-act-btn {
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    .search-act-single {
      background: #D32F2F;
      color: white;
    }
    .search-act-route {
      background: #1976D2;
      color: white;
    }
    .search-act-del {
      background: #757575;
      color: white;
    }

    /* Floating control bar (Right) */
    .map-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(4px);
    }
    .ctrl-btn:active {
      background: #e0e0e0;
      transform: scale(0.97);
    }
    .ctrl-btn.active-btn {
      background: #E8F5E9;
      color: #2E7D32;
      border-color: #81C784;
    }

    /* Bottom hint banner */
    .hint-banner {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(33, 33, 33, 0.88);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }

    /* Custom Marker Styles */
    .waypoint-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      border: 2px solid #ffffff;
      transition: transform 0.15s ease;
    }
    .pin-start {
      background: #2E7D32; /* Green */
    }
    .pin-mid {
      background: #1976D2; /* Blue */
    }
    .pin-end {
      background: #E65100; /* Orange */
    }
    .pin-single {
      background: #D32F2F; /* Red */
    }

    /* Runner / Vehicle simulated position marker */
    .sim-cursor {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #00E676;
      border: 3px solid #ffffff;
      box-shadow: 0 0 14px rgba(0, 230, 118, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .sim-arrow {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 14px solid #1a237e;
      position: absolute;
      top: 5px;
    }
    .sim-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(0, 230, 118, 0.45);
      animation: pulse 1.5s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* Popup button */
    .popup-del-btn {
      margin-top: 6px;
      padding: 4px 10px;
      background: #d32f2f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Top Search Container -->
  <div class="search-container" id="search-container">
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 搜索地标/车站/高校/坐标" autocomplete="off" />
      <button class="search-clear-btn" id="search-clear-btn" onclick="clearSearchInput()" style="display:none;" title="清空">✕</button>
      <button class="search-btn" id="search-action-btn" onclick="executeSearch(true)">搜索</button>
      <button class="search-cfg-btn" onclick="toggleApiKeyModal()" title="设置高德 Web Key (可选)">⚙️</button>
    </div>

    <!-- Dropdown Results Card -->
    <div class="search-results-panel" id="search-results-panel" style="display:none;">
      <div class="search-results-header">
        <span id="search-results-title">🔍 搜索结果</span>
        <button class="close-results-btn" onclick="hideSearchResults()">✕</button>
      </div>
      <div class="search-results-list" id="search-results-list"></div>
    </div>
  </div>

  <!-- Optional AMap Web API Key Modal -->
  <div class="api-key-modal" id="api-key-modal" style="display:none;">
    <div class="modal-card">
      <div class="modal-title">⚙️ 高德 Web 服务 Key 设置</div>
      <div class="modal-desc">
        默认已提供<b>全国核心地标库</b>与<b>Photon 智能纠偏搜索</b>。<br>
        若您有高德开放平台 Web 服务 Key，填入后可解锁官方原生海量 POI 联想检索：
      </div>
      <input type="text" id="amap-key-input" class="modal-input" placeholder="输入高德 Web 服务 Key (留空使用默认)" />
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="toggleApiKeyModal()">取消</button>
        <button class="modal-btn modal-btn-save" onclick="saveAmapKey()">保存设置</button>
      </div>
    </div>
  </div>

  <!-- Floating Controls -->
  <div class="map-controls">
    <button class="ctrl-btn" id="btn-snap" onclick="toggleRoadSnap()">🛣️ 吸附道路: 关</button>
    <button class="ctrl-btn" id="btn-follow" onclick="toggleFollow()">🎯 视角跟随: 开</button>
    <button class="ctrl-btn" id="btn-undo" onclick="undoLast()">↩️ 撤销</button>
    <button class="ctrl-btn" id="btn-clear" onclick="clearAll()">🗑️ 清空</button>
    <button class="ctrl-btn" onclick="fitRoute()">🎯 全览</button>
    <button class="ctrl-btn" onclick="toggleLayer()">🗺️ 图层</button>
    <button class="ctrl-btn" onclick="toggleExpand()">⛶ 展开</button>
  </div>

  <div class="hint-banner" id="hint-text">
    👆 点击地图任意位置添加途经路点
  </div>

  <script>
    var map;
    var currentMode = "route"; // "route" or "single"
    var waypoints = []; // [{lat, lon, marker}, ...]
    var routeLine = null;
    var singleMarker = null;
    var simMarker = null;
    var isFollowing = true;
    var roadSnapEnabled = false;
    var snapModes = [
      { id: 'walking', label: '🚶 步行吸附' },
      { id: 'bike', label: '🚴 骑行吸附' },
      { id: 'driving', label: '🚗 驾车吸附' }
    ];
    var snapModeIndex = 0;

    // ================= 高精度坐标系转换工具 (WGS-84 / GCJ-02 / BD-09) =================
    var CoordTransform = {
      A: 6378245.0,
      EE: 0.00669342162296594323,
      PI: Math.PI,
      X_PI: Math.PI * 3000.0 / 180.0,

      outOfChina: function(lat, lon) {
        if (lon < 72.004 || lon > 137.8347) return true;
        if (lat < 0.8293 || lat > 55.8271) return true;
        return false;
      },

      transformLat: function(x, y) {
        var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * this.PI) + 20.0 * Math.sin(2.0 * x * this.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * this.PI) + 40.0 * Math.sin(y / 3.0 * this.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * this.PI) + 320 * Math.sin(y * this.PI / 30.0)) * 2.0 / 3.0;
        return ret;
      },

      transformLon: function(x, y) {
        var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * this.PI) + 20.0 * Math.sin(2.0 * x * this.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * this.PI) + 40.0 * Math.sin(x / 3.0 * this.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * this.PI) + 300.0 * Math.sin(x / 30.0 * this.PI)) * 2.0 / 3.0;
        return ret;
      },

      // WGS-84 (GPS/Photon/Nominatim) -> GCJ-02 (高德瓦片火星坐标系，彻底消除500米偏移)
      wgs84ToGcj02: function(wgsLat, wgsLon) {
        if (this.outOfChina(wgsLat, wgsLon)) return [wgsLat, wgsLon];
        var dLat = this.transformLat(wgsLon - 105.0, wgsLat - 35.0);
        var dLon = this.transformLon(wgsLon - 105.0, wgsLat - 35.0);
        var radLat = wgsLat / 180.0 * this.PI;
        var magic = Math.sin(radLat);
        magic = 1 - this.EE * magic * magic;
        var sqrtMagic = Math.sqrt(magic);
        dLat = (dLat * 180.0) / ((this.A * (1 - this.EE)) / (magic * sqrtMagic) * this.PI);
        dLon = (dLon * 180.0) / (this.A / sqrtMagic * Math.cos(radLat) * this.PI);
        return [parseFloat((wgsLat + dLat).toFixed(6)), parseFloat((wgsLon + dLon).toFixed(6))];
      },

      // GCJ-02 -> WGS-84
      gcj02ToWgs84: function(gcjLat, gcjLon) {
        if (this.outOfChina(gcjLat, gcjLon)) return [gcjLat, gcjLon];
        var p = this.wgs84ToGcj02(gcjLat, gcjLon);
        var dLat = p[0] - gcjLat;
        var dLon = p[1] - gcjLon;
        return [parseFloat((gcjLat - dLat).toFixed(6)), parseFloat((gcjLon - dLon).toFixed(6))];
      },

      // 百度 BD-09 -> GCJ-02
      bd09ToGcj02: function(bdLat, bdLon) {
        var x = bdLon - 0.0065;
        var y = bdLat - 0.006;
        var z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * this.X_PI);
        var theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * this.X_PI);
        var gcjLon = z * Math.cos(theta);
        var gcjLat = z * Math.sin(theta);
        return [parseFloat(gcjLat.toFixed(6)), parseFloat(gcjLon.toFixed(6))];
      },

      distanceMeters: function(lat1, lon1, lat2, lon2) {
        var R = 6371000;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLon = (lon2 - lon1) * Math.PI / 180;
        var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return Math.round(R * c);
      },

      formatDist: function(meters) {
        if (!meters && meters !== 0) return '';
        if (meters < 1000) return meters + 'm';
        return (meters / 1000).toFixed(1) + 'km';
      }
    };

    // ================= 全国核心高精度离线地标库 (GCJ-02 原生火星坐标) =================
    var PRESET_DATABASE = [
      // 直辖市与省会中心
      { name: '北京', city: '北京市', addr: '东城区王府井/天安门区域', lat: 39.904200, lon: 116.407400 },
      { name: '上海', city: '上海市', addr: '黄浦区人民广场', lat: 31.230416, lon: 121.473701 },
      { name: '广州', city: '广州市', addr: '越秀区人民公园', lat: 23.129112, lon: 113.264385 },
      { name: '深圳', city: '深圳市', addr: '福田区市民中心', lat: 22.543099, lon: 114.057868 },
      { name: '天津', city: '天津市', addr: '和平区海河之星', lat: 39.125596, lon: 117.190182 },
      { name: '重庆', city: '重庆市', addr: '渝中区解放碑', lat: 29.563010, lon: 106.551556 },
      { name: '杭州', city: '杭州市', addr: '拱墅区武林广场', lat: 30.274084, lon: 120.155070 },
      { name: '南京', city: '南京市', addr: '玄武区新街口', lat: 32.060255, lon: 118.796877 },
      { name: '成都', city: '成都市', addr: '锦江区天府广场', lat: 30.572815, lon: 104.066801 },
      { name: '武汉', city: '武汉市', addr: '江汉区汉口核心区', lat: 30.592849, lon: 114.305539 },
      { name: '西安', city: '西安市', addr: '碑林区钟鼓楼', lat: 34.341568, lon: 108.939770 },
      { name: '长沙', city: '长沙市', addr: '天心区五一广场', lat: 28.228209, lon: 112.938814 },
      { name: '郑州', city: '郑州市', addr: '二七区二七广场', lat: 34.746600, lon: 113.625368 },
      { name: '合肥', city: '合肥市', addr: '庐阳区淮河路', lat: 31.820587, lon: 117.227239 },
      { name: '济南', city: '济南市', addr: '历下区泉城广场', lat: 36.651216, lon: 117.120095 },

    // ================= 智能匹配与排名算法 (杜绝'北京西站'被'北京'盲目截胡) =================
    function searchPresets(query, centerLat, centerLon) {
      if (!query) return [];
      var q = query.replace(/[\s,，]+/g, '').toLowerCase();
      var qNorm = q.replace(/(市|省|区|县|站|大学|国际机场|机场|风景名胜区|风景区|公园)$/g, '');
      var results = [];

      for (var i = 0; i < PRESET_DATABASE.length; i++) {
        var item = PRESET_DATABASE[i];
        var nameLower = item.name.toLowerCase();
        var cityLower = (item.city || '').toLowerCase();
        var full = cityLower + nameLower;

        var score = 0;
        // 1. 完全精确匹配
        if (nameLower === q || item.name === query) {
          score = 100;
        } else if (qNorm.length >= 2 && nameLower === qNorm) {
          score = 95;
        } else if (nameLower.startsWith(q) || full.startsWith(q)) {
          // 2. 前缀精确匹配 (如 '北京西' 匹配 '北京西站')
          score = 80;
        } else if (qNorm.length >= 2 && (nameLower.startsWith(qNorm) || full.startsWith(qNorm))) {
          score = 70;
        } else if (q.length >= 2 && (nameLower.indexOf(q) !== -1 || full.indexOf(q) !== -1)) {
          // 3. 子串匹配 (要求至少2个字符，杜绝单字'西'误撞'西湖')
          score = 50;
        } else if (qNorm.length >= 2 && (nameLower.indexOf(qNorm) !== -1 || full.indexOf(qNorm) !== -1)) {
          score = 40;
        }

        if (score > 0) {
          var dist = (centerLat && centerLon) ? CoordTransform.distanceMeters(centerLat, centerLon, item.lat, item.lon) : 0;
          results.push({
            name: item.name,
            address: (item.city ? item.city + ' · ' : '') + item.addr,
            lat: item.lat,
            lon: item.lon,
            badge: '精选',
            badgeClass: 'badge-preset',
            distance: dist,
            score: score
          });
        }
      }

      // 按匹配度权重降序，同权重按离当前视口中心距离升序
      results.sort(function(a, b) {
        if (b.score !== a.score) return b.score - a.score;
        return a.distance - b.distance;
      });

      return results.slice(0, 8);
    }

    // ================= 智能坐标解析 (智能判断经纬度先后顺序与坐标系) =================
    function parseCoordinate(query) {
      var parts = query.replace(/[;；|]/g, ',').split(/[,，\s]+/);
      if (parts.length < 2) return null;
      var num1 = parseFloat(parts[0]);
      var num2 = parseFloat(parts[1]);
      if (isNaN(num1) || isNaN(num2)) return null;

      var lat, lon;
      // 中国境内经度约 72~138，纬度约 3~55。智能纠正经纬度颠倒
      if (num1 >= 72.0 && num1 <= 138.0 && num2 >= 3.0 && num2 <= 55.0) {
        lon = num1;
        lat = num2;
      } else if (num1 >= 3.0 && num1 <= 55.0 && num2 >= 72.0 && num2 <= 138.0) {
        lat = num1;
        lon = num2;
      } else if (Math.abs(num1) <= 90 && Math.abs(num2) <= 180) {
        lat = num1;
        lon = num2;
      } else {
        return null;
      }

      var isWgs = /wgs/i.test(query) || /gps/i.test(query);
      var isBd = /bd/i.test(query) || /baidu/i.test(query);
      var finalLat = lat;
      var finalLon = lon;
      var desc = '直接坐标定位';

      if (isBd) {
        var gcj = CoordTransform.bd09ToGcj02(lat, lon);
        finalLat = gcj[0];
        finalLon = gcj[1];
        desc = '百度BD-09坐标已高精度纠偏至GCJ-02';
      } else if (isWgs) {
        var gcj2 = CoordTransform.wgs84ToGcj02(lat, lon);
        finalLat = gcj2[0];
        finalLon = gcj2[1];
        desc = 'GPS/WGS-84标准坐标已消除偏移至GCJ-02';
      }

      return {
        name: '坐标: ' + finalLat.toFixed(6) + ', ' + finalLon.toFixed(6),
        address: desc,
        lat: finalLat,
        lon: finalLon,
        badge: '坐标',
        badgeClass: 'badge-coord',
        distance: 0,
        score: 100
      };
    }

      attribution: '© 高德地图'
    });

    var gaodeSat = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
      subdomains: ['1', '2', '3', '4'],
      maxZoom: 18,
      minZoom: 3
    });
    var gaodeRoad = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
      subdomains: ['1', '2', '3', '4'],
      maxZoom: 18,
      minZoom: 3
    });
    var satelliteGroup = L.layerGroup([gaodeSat, gaodeRoad]);

    var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    });

    var currentLayerIndex = 0;
    var layers = [gaodeVector, satelliteGroup, osmLayer];
    var layerNames = ['高德地图', '高德卫星', 'OSM'];

    var searchDebounceTimer = null;
    var searchController = null;
    var searchPinMarker = null;

    function initMap() {
      map = L.map('map', {
        center: [40.0138, 116.3835],
        zoom: 14,
        zoomControl: false,
        layers: [gaodeVector]
      });

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // 用户主动拖动时解除跟随
      map.on('dragstart', function() {
        if (isFollowing) {
          isFollowing = false;
          updateFollowBtn();
        }
      });

      map.on('click', function(e) {
        hideSearchResults();
        var lat = parseFloat(e.latlng.lat.toFixed(6));
        var lon = parseFloat(e.latlng.lng.toFixed(6));

        if (currentMode === 'route') {
          if (roadSnapEnabled && waypoints.length > 0) {
            snapRouteToRoad(waypoints[waypoints.length - 1], { lat: lat, lon: lon });
          } else {
            addWaypoint(lat, lon, true);
          }
        } else {
          setSinglePoint(lat, lon, true);
        }
      });

      // 绑定输入框输入联想与按键事件
      var inputEl = document.getElementById('search-input');
      inputEl.addEventListener('input', function() {
        var query = this.value.trim();
        document.getElementById('search-clear-btn').style.display = query ? 'block' : 'none';

        if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
        if (!query) {
          hideSearchResults();
          return;
        }

        // 防抖 350ms 触发联想搜索
        searchDebounceTimer = setTimeout(function() {
          executeSearch(false);
        }, 350);
      });

      inputEl.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
          executeSearch(true);
        }
      });

      inputEl.addEventListener('focus', function() {
        if (this.value.trim().length > 0) {
          executeSearch(false);
        }
      });
    }

    // ================= 搜索引擎入口 (离线精选 + 高德API + Photon纠偏 + 降级) =================
    function executeSearch(userTriggered) {
      var query = document.getElementById('search-input').value.trim();
      var clearBtn = document.getElementById('search-clear-btn');
      clearBtn.style.display = query ? 'block' : 'none';

      if (!query) {
        hideSearchResults();
        return;
      }

      var center = map ? map.getCenter() : { lat: 39.9, lng: 116.4 };
      var candidates = [];

      // 1. 尝试坐标解析
      var coordItem = parseCoordinate(query);
      if (coordItem) {
        coordItem.distance = CoordTransform.distanceMeters(center.lat, center.lng, coordItem.lat, coordItem.lon);
        candidates.push(coordItem);
      }

      // 2. 检索高精度离线精选库
      var presetMatches = searchPresets(query, center.lat, center.lng);
      candidates = candidates.concat(presetMatches);

      // 用户主动按回车/点击按钮：如果有高分完全匹配项或坐标，直接秒跳
      if (userTriggered && candidates.length > 0 && (candidates[0].score >= 95 || coordItem)) {
        selectSearchResult(candidates[0]);
        return;
      }

      // 立即展现第一梯队结果 (秒开无需等待网络)
      if (candidates.length > 0) {
        renderSearchResults(candidates, query);
      }

      // 3. 在线接口检索
      if (searchController) {
        searchController.abort();
      }
      searchController = new AbortController();
      var signal = searchController.signal;

      var amapKey = localStorage.getItem('amap_web_key') || '';
      if (amapKey) {
        queryAmapApi(query, amapKey, signal, candidates);
      } else {
        queryPhotonApi(query, center.lat, center.lng, signal, candidates);
      }
    }

    // Photon 在线搜索 (内置当前视口偏置与精准 WGS84 -> GCJ-02 火星纠偏)
    function queryPhotonApi(query, centerLat, centerLon, signal, existingList) {
      var url = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(query) +
                '&lat=' + centerLat + '&lon=' + centerLon + '&limit=6';

      fetch(url, { signal: signal })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var onlineResults = [];
          if (data && data.features) {
            data.features.forEach(function(feat) {
              var props = feat.properties || {};
              var geom = feat.geometry || {};
              var coords = geom.coordinates || [];
              if (coords.length >= 2) {
                var wgsLon = coords[0];
                var wgsLat = coords[1];
                // 关键技术纠偏：将国际WGS-84标准坐标转换为高德GCJ-02
                var gcj = CoordTransform.wgs84ToGcj02(wgsLat, wgsLon);
                var gcjLat = gcj[0];
                var gcjLon = gcj[1];

                var title = props.name || query;
                var addrParts = [];
                if (props.city) addrParts.push(props.city);
                if (props.district) addrParts.push(props.district);
                if (props.street) addrParts.push(props.street);
                if (props.country && !props.city) addrParts.push(props.country);
                var addr = addrParts.join(' · ') || props.osm_value || '地理数据';

                var dist = CoordTransform.distanceMeters(centerLat, centerLon, gcjLat, gcjLon);
                onlineResults.push({
                  name: title,
                  address: addr,
                  lat: gcjLat,
                  lon: gcjLon,
                  badge: '在线',
                  badgeClass: 'badge-online',
                  distance: dist,
                  score: 45
                });
              }
            });
          }

          var combined = mergeResults(existingList, onlineResults);
          renderSearchResults(combined, query);
        })
        .catch(function(err) {
          if (err.name === 'AbortError') return;
          // 若 Photon 超时，降级使用 Nominatim 纠偏搜索
          fallbackNominatim(query, centerLat, centerLon, signal, existingList);
        });
    }

    // 降级使用 OpenStreetMap Nominatim (严格加入 GCJ-02 转换与超时保护)
    function fallbackNominatim(query, centerLat, centerLon, signal, existingList) {
      var timeoutId = setTimeout(function() {
        if (searchController) searchController.abort();
      }, 3500);

      var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(query);
      fetch(url, { signal: signal })
        .then(function(res) {
          clearTimeout(timeoutId);
          return res.json();
        })
        .then(function(data) {
          var osmResults = [];
          if (data && data.length > 0) {
            data.forEach(function(item) {
              var wgsLat = parseFloat(item.lat);
              var wgsLon = parseFloat(item.lon);
              var gcj = CoordTransform.wgs84ToGcj02(wgsLat, wgsLon);
              var title = (item.display_name || '').split(',')[0] || query;
              var dist = CoordTransform.distanceMeters(centerLat, centerLon, gcj[0], gcj[1]);

              osmResults.push({
                name: title,
                address: item.display_name ? item.display_name.split(',').slice(1, 4).join(' ') : 'OSM数据',
                lat: gcj[0],
                lon: gcj[1],
                badge: 'OSM',
                badgeClass: 'badge-online',
                distance: dist,
                score: 35
              });
            });
          }
          var combined = mergeResults(existingList, osmResults);
          renderSearchResults(combined, query);
        })
        .catch(function() {
          clearTimeout(timeoutId);
          if (existingList.length === 0) {
            renderSearchResults([], query);
          }
        });
    }

    // 高德 Web 服务 API 官方直连 (若用户在配置弹窗中填入了 Key)
    function queryAmapApi(query, key, signal, existingList) {
      var center = map ? map.getCenter() : { lat: 39.9, lng: 116.4 };
      var url = 'https://restapi.amap.com/v3/place/text?keywords=' + encodeURIComponent(query) +
                '&key=' + encodeURIComponent(key) + '&offset=8&page=1';

      fetch(url, { signal: signal })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var amapResults = [];
          if (data && data.status === '1' && data.pois) {
            data.pois.forEach(function(poi) {
              if (poi.location) {
                var coords = poi.location.split(',');
                var pLon = parseFloat(coords[0]);
                var pLat = parseFloat(coords[1]);
                var dist = CoordTransform.distanceMeters(center.lat, center.lng, pLat, pLon);
                amapResults.push({
                  name: poi.name,
                  address: (poi.cityname || '') + ' ' + (poi.adname || '') + ' ' + (poi.address || ''),
                  lat: pLat,
                  lon: pLon,
                  badge: '高德',
                  badgeClass: 'badge-amap',
                  distance: dist,
                  score: 90
                });
              }
            });
          }
          var combined = mergeResults(existingList, amapResults);
          renderSearchResults(combined, query);
        })
        .catch(function(err) {
          if (err.name === 'AbortError') return;
          queryPhotonApi(query, center.lat, center.lng, signal, existingList);
        });
    }

    // 智能去重与聚合
    function mergeResults(primaryList, secondaryList) {
      var seen = {};
      var merged = [];

      primaryList.forEach(function(item) {
        var key = item.lat.toFixed(4) + '_' + item.lon.toFixed(4);
        seen[key] = true;
        merged.push(item);
      });

      secondaryList.forEach(function(item) {
        var key = item.lat.toFixed(4) + '_' + item.lon.toFixed(4);
        if (!seen[key]) {
          seen[key] = true;
          merged.push(item);
        }
      });

      return merged;
    }

    // 渲染候选结果下拉列表卡片
    function renderSearchResults(items, query) {
      var panel = document.getElementById('search-results-panel');
      var list = document.getElementById('search-results-list');
      var title = document.getElementById('search-results-title');

      if (!items || items.length === 0) {
        title.innerText = '🔍 检索无匹配结果';
        list.innerHTML = '<div class="search-empty">未找到关于 "' + escapeHtml(query) + '" 的地点<br><span style="color:#aaa;">请尝试输入完整地标、火车站全名或经纬度坐标</span></div>';
        panel.style.display = 'flex';
        return;
      }

      title.innerText = '🔍 搜索建议 (' + items.length + ' 个结果)';
      var html = '';
      items.forEach(function(item, idx) {
        var distBadge = item.distance ? ('<span class="search-item-dist">' + CoordTransform.formatDist(item.distance) + '</span>') : '';
        html += `
          <div class="search-item" onclick="onSelectCandidate(${idx})">
            <div class="search-item-top">
              <div class="search-item-name">${escapeHtml(item.name)}</div>
              <span class="search-item-badge ${item.badgeClass || 'badge-preset'}">${item.badge || '精选'}</span>
            </div>
            <div class="search-item-bottom">
              <div class="search-item-addr">${escapeHtml(item.address || '')}</div>
              ${distBadge}
            </div>
          </div>
        `;
      });

      list.innerHTML = html;
      panel.style.display = 'flex';
      window._currentSearchResults = items;
    }

    function onSelectCandidate(index) {
      if (window._currentSearchResults && window._currentSearchResults[index]) {
        selectSearchResult(window._currentSearchResults[index]);
      }
    }

    // 选中候选条目 -> 平滑飞行并在地图上落下高亮脉冲靶点
    function selectSearchResult(item) {
      hideSearchResults();
      document.getElementById('search-input').value = item.name;
      document.getElementById('search-clear-btn').style.display = 'block';

      if (searchPinMarker) {
        map.removeLayer(searchPinMarker);
        searchPinMarker = null;
      }

      var icon = L.divIcon({
        className: 'custom-div-icon',
        html: `
          <div class="search-target-pin">
            <div class="search-target-pulse"></div>
            <div class="search-target-center">🎯</div>
          </div>
        `,
        iconSize: [34, 34],
        iconAnchor: [17, 17],
        popupAnchor: [0, -18]
      });

      searchPinMarker = L.marker([item.lat, item.lon], { icon: icon, zIndexOffset: 2500 }).addTo(map);

      var distText = item.distance ? (' · <span style="color:#1976D2;">距此 ' + CoordTransform.formatDist(item.distance) + '</span>') : '';
      var popupHtml = `
        <div style="min-width: 170px; font-size: 13px; line-height: 1.4;">
          <div style="font-weight: bold; color: #1a1a1a; margin-bottom: 2px;">${escapeHtml(item.name)}</div>
          <div style="font-size: 11px; color: #666; margin-bottom: 5px;">${escapeHtml(item.address)}${distText}</div>
          <div style="font-size: 10px; color: #888; margin-bottom: 7px; font-family: monospace;">${item.lat.toFixed(6)}, ${item.lon.toFixed(6)}</div>
          <div class="search-action-btn-row">
            <button class="search-act-btn search-act-single" onclick="setSingleFromSearch(${item.lat}, ${item.lon})">📍 设为单点</button>
            <button class="search-act-btn search-act-route" onclick="addRouteFromSearch(${item.lat}, ${item.lon})">➕ 加为路点</button>
            <button class="search-act-btn search-act-del" onclick="removeSearchPin()">✕ 移除</button>
          </div>
        </div>
      `;
      searchPinMarker.bindPopup(popupHtml).openPopup();
      map.flyTo([item.lat, item.lon], 16, { duration: 1.0 });
      showToast('已精确定位至: ' + item.name);
    }

    function setSingleFromSearch(lat, lon) {
      setSinglePoint(lat, lon, true);
      removeSearchPin();
      showToast('已设为单点模拟目标: ' + lat.toFixed(6) + ', ' + lon.toFixed(6));
    }

    function addRouteFromSearch(lat, lon) {
      if (currentMode !== 'route') {
        window.setMode('route');
      }
      if (roadSnapEnabled && waypoints.length > 0) {
        snapRouteToRoad(waypoints[waypoints.length - 1], { lat: lat, lon: lon });
      } else {
        addWaypoint(lat, lon, true);
      }
      removeSearchPin();
      showToast('已添加为路线路点');
    }

    function removeSearchPin() {
      if (searchPinMarker) {
        map.removeLayer(searchPinMarker);
        searchPinMarker = null;
      }
    }

    function clearSearchInput() {
      var input = document.getElementById('search-input');
      input.value = '';
      document.getElementById('search-clear-btn').style.display = 'none';
      hideSearchResults();
      removeSearchPin();
      input.focus();
    }

    function hideSearchResults() {
      var panel = document.getElementById('search-results-panel');
      if (panel) panel.style.display = 'none';
    }

    function toggleApiKeyModal() {
      var modal = document.getElementById('api-key-modal');
      var input = document.getElementById('amap-key-input');
      if (modal.style.display === 'none' || !modal.style.display) {
        input.value = localStorage.getItem('amap_web_key') || '';
        modal.style.display = 'flex';
      } else {
        modal.style.display = 'none';
      }
    }

    function saveAmapKey() {
      var input = document.getElementById('amap-key-input');
      var key = input.value.trim();
      if (key) {
        localStorage.setItem('amap_web_key', key);
        showToast('高德 Web Key 已保存，将优先调用官方海量 POI 检索');
      } else {
        localStorage.removeItem('amap_web_key');
        showToast('已恢复为离线精选 + Photon 纠偏搜索模式');
      }
      toggleApiKeyModal();
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;');
    }


    // 切换道路沿路吸附（支持 步行 -> 骑行 -> 驾车 -> 关 循环切换）
    function toggleRoadSnap() {
      var btn = document.getElementById('btn-snap');
      if (!roadSnapEnabled) {
        roadSnapEnabled = true;
        snapModeIndex = 0;
        btn.innerText = "🛣️ " + snapModes[snapModeIndex].label;
        btn.classList.add('active-btn');
        showToast("已开启真实道路自动吸附: " + snapModes[snapModeIndex].label);
      } else {
        snapModeIndex++;
        if (snapModeIndex < snapModes.length) {
          btn.innerText = "🛣️ " + snapModes[snapModeIndex].label;
          showToast("已切换吸附模式: " + snapModes[snapModeIndex].label);
        } else {
          roadSnapEnabled = false;
          snapModeIndex = 0;
          btn.innerText = "🛣️ 吸附道路: 关";
          btn.classList.remove('active-btn');
          showToast("已切换为直线标点模式");
        }
      }
    }

    // 沿马路自动吸附规划路径（严格将 GCJ-02 纠偏至 WGS-84 请求 OSRM，再转换回 GCJ-02 精确渲染）
    function snapRouteToRoad(fromPt, toPt) {
      var profile = snapModes[snapModeIndex].id;
      showToast("正在规划街道吸附路径 (" + snapModes[snapModeIndex].label + ")...");
      var wgsFrom = CoordTransform.gcj02ToWgs84(fromPt.lat, fromPt.lon);
      var wgsTo = CoordTransform.gcj02ToWgs84(toPt.lat, toPt.lon);
      var osrmUrl = 'https://router.project-osrm.org/route/v1/' + profile + '/' +
                    wgsFrom[1].toFixed(6) + ',' + wgsFrom[0].toFixed(6) + ';' +
                    wgsTo[1].toFixed(6) + ',' + wgsTo[0].toFixed(6) + '?overview=full&geometries=geojson';

      var controller = new AbortController();
      var timeoutId = setTimeout(function() { controller.abort(); }, 4000);

      fetch(osrmUrl, { signal: controller.signal })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          clearTimeout(timeoutId);
          if (data && data.routes && data.routes.length > 0) {
            var coords = data.routes[0].geometry.coordinates;
            // 采样步长（若点太多，每隔 2~3 个点取一个）
            var step = Math.max(1, Math.floor(coords.length / 15));
            for (var i = 1; i < coords.length; i += step) {
              var wgsLon = coords[i][0];
              var wgsLat = coords[i][1];
              var gcj = CoordTransform.wgs84ToGcj02(wgsLat, wgsLon);
              addWaypoint(parseFloat(gcj[0].toFixed(6)), parseFloat(gcj[1].toFixed(6)), false);
            }
            // 确保终点加入
            addWaypoint(toPt.lat, toPt.lon, true);
            showToast("道路吸附完成，已生成街道拐角路线");
          } else {
            addWaypoint(toPt.lat, toPt.lon, true);
          }
        })
        .catch(function() {
          clearTimeout(timeoutId);
          // 降级为直接加点
          addWaypoint(toPt.lat, toPt.lon, true);
        });
    }

    // 视角跟随开关
    function toggleFollow() {
      isFollowing = !isFollowing;
      updateFollowBtn();
      if (isFollowing && simMarker) {
        map.panTo(simMarker.getLatLng(), { animate: true });
      }
    }

    function updateFollowBtn() {
      var btn = document.getElementById('btn-follow');
      if (isFollowing) {
        btn.innerText = "🎯 视角跟随: 开";
        btn.classList.add('active-btn');
      } else {
        btn.innerText = "🎯 视角跟随: 关";
        btn.classList.remove('active-btn');
      }
    }

    function toggleExpand() {
      if (window.AndroidBridge && window.AndroidBridge.onToggleExpand) {
        window.AndroidBridge.onToggleExpand();
      }
      setTimeout(function() {
        if (map) map.invalidateSize();
      }, 300);
    }

    function toggleLayer() {
      map.removeLayer(layers[currentLayerIndex]);
      currentLayerIndex = (currentLayerIndex + 1) % layers.length;
      map.addLayer(layers[currentLayerIndex]);
      showToast("切换至: " + layerNames[currentLayerIndex]);
    }

    function showToast(msg) {
      var hint = document.getElementById('hint-text');
      hint.innerText = msg;
      setTimeout(function() {
        hint.innerText = currentMode === "route" ? "👆 点击地图任意位置添加途经路点" : "👆 点击地图选取单点定位目标";
      }, 2500);
    }

    // Add waypoint in route mode
    function addWaypoint(lat, lon, notifyNative) {
      var index = waypoints.length;
      var marker = createWaypointMarker(lat, lon, index);
      waypoints.push({ lat: lat, lon: lon, marker: marker });
      refreshWaypointIndices();
      redrawRouteLine();

      if (notifyNative && window.AndroidBridge) {
        window.AndroidBridge.onWaypointAdded(lat, lon, waypoints.length);
        notifyWaypointsChanged();
      }
    }

    function createWaypointMarker(lat, lon, index) {
      var icon = createPinIcon(index, waypoints.length + 1);
      var marker = L.marker([lat, lon], {
        icon: icon,
        draggable: true
      }).addTo(map);

      marker.on('dragend', function(e) {
        var newPos = e.target.getLatLng();
        var idx = findMarkerIndex(marker);
        if (idx !== -1) {
          waypoints[idx].lat = parseFloat(newPos.lat.toFixed(6));
          waypoints[idx].lon = parseFloat(newPos.lng.toFixed(6));
          redrawRouteLine();
          updatePopup(marker, idx);
          notifyWaypointsChanged();
        }
      });

      updatePopup(marker, index);
      return marker;
    }

    function updatePopup(marker, index) {
      var isStart = index === 0;
      var isEnd = index === waypoints.length - 1 && waypoints.length > 1;
      var tag = isStart ? "🚩 起点" : (isEnd ? "🏁 终点" : "📍 路点 #" + index);
      var lat = waypoints[index] ? waypoints[index].lat : marker.getLatLng().lat.toFixed(6);
      var lon = waypoints[index] ? waypoints[index].lon : marker.getLatLng().lng.toFixed(6);

      var content = `
        <div style="font-size:13px; min-width:140px;">
          <b>${tag}</b><br>
          <span style="color:#666;font-size:11px;">${lat}, ${lon}</span><br>
          <button class="popup-del-btn" onclick="removeWaypointByIndex(${index})">🗑️ 删除此路点</button>
        </div>
      `;
      marker.bindPopup(content);
    }

    function createPinIcon(index, total) {
      var label = "" + (index + 1);
      var cls = "pin-mid";
      if (index === 0) {
        label = "起";
        cls = "pin-start";
      } else if (index === total - 1 && total > 1) {
        label = "终";
        cls = "pin-end";
      }

      return L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="waypoint-pin ${cls}">${label}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    function refreshWaypointIndices() {
      for (var i = 0; i < waypoints.length; i++) {
        var wp = waypoints[i];
        wp.marker.setIcon(createPinIcon(i, waypoints.length));
        updatePopup(wp.marker, i);
      }
    }

    function findMarkerIndex(marker) {
      for (var i = 0; i < waypoints.length; i++) {
        if (waypoints[i].marker === marker) return i;
      }
      return -1;
    }

    function removeWaypointByIndex(index) {
      if (index >= 0 && index < waypoints.length) {
        map.removeLayer(waypoints[index].marker);
        waypoints.splice(index, 1);
        refreshWaypointIndices();
        redrawRouteLine();
        notifyWaypointsChanged();
      }
    }

    function undoLast() {
      if (waypoints.length > 0) {
        var last = waypoints.pop();
        map.removeLayer(last.marker);
        refreshWaypointIndices();
        redrawRouteLine();
        notifyWaypointsChanged();
      }
    }

    function clearAll(notifyNative) {
      for (var i = 0; i < waypoints.length; i++) {
        map.removeLayer(waypoints[i].marker);
      }
      waypoints = [];
      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }
      if (singleMarker) {
        map.removeLayer(singleMarker);
        singleMarker = null;
      }
      if (notifyNative !== false) {
        notifyWaypointsChanged();
      }
    }

    function redrawRouteLine() {
      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }
      if (waypoints.length < 2) return;

      var latlngs = waypoints.map(function(wp) {
        return [wp.lat, wp.lon];
      });

      routeLine = L.polyline(latlngs, {
        color: '#1E88E5',
        weight: 6,
        opacity: 0.88,
        lineJoin: 'round'
      }).addTo(map);
    }

    function fitRoute() {
      if (waypoints.length > 0) {
        var bounds = L.latLngBounds(waypoints.map(function(wp) { return [wp.lat, wp.lon]; }));
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
      } else if (singleMarker) {
        map.panTo(singleMarker.getLatLng());
      }
    }

    function notifyWaypointsChanged() {
      if (window.AndroidBridge) {
        var list = waypoints.map(function(wp) {
          return { lat: wp.lat, lon: wp.lon };
        });
        window.AndroidBridge.onWaypointsUpdated(JSON.stringify(list));
      }
    }

    // ================= Native Interface Methods =================
    window.setRouteWaypoints = function(jsonStr) {
      try {
        clearAll(false);
        var pts = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
        if (!Array.isArray(pts)) return;

        pts.forEach(function(pt) {
          addWaypoint(parseFloat(pt.lat), parseFloat(pt.lon), false);
        });
        fitRoute();
        notifyWaypointsChanged();
      } catch (e) {
        console.error("setRouteWaypoints err:", e);
      }
    };

    window.setMode = function(mode) {
      currentMode = mode;
      var undoBtn = document.getElementById('btn-undo');
      var snapBtn = document.getElementById('btn-snap');
      var hint = document.getElementById('hint-text');

      if (mode === "single") {
        undoBtn.style.display = 'none';
        snapBtn.style.display = 'none';
        hint.innerText = "👆 点击地图任意位置选取单点模拟目标";
      } else {
        undoBtn.style.display = 'flex';
        snapBtn.style.display = 'flex';
        hint.innerText = "👆 点击地图任意位置添加途经路点";
      }
    };

    window.setSinglePoint = function(lat, lon, notifyNative) {
      lat = parseFloat(lat.toFixed ? lat.toFixed(6) : lat);
      lon = parseFloat(lon.toFixed ? lon.toFixed(6) : lon);

      if (singleMarker) {
        singleMarker.setLatLng([lat, lon]);
      } else {
        var icon = L.divIcon({
          className: 'custom-div-icon',
          html: `<div class="waypoint-pin pin-single">📍</div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });
        singleMarker = L.marker([lat, lon], { icon: icon, draggable: true }).addTo(map);
        singleMarker.on('dragend', function(e) {
          var p = e.target.getLatLng();
          if (window.AndroidBridge) {
            window.AndroidBridge.onSinglePointChanged(p.lat, p.lng);
          }
        });
      }

      if (notifyNative && window.AndroidBridge) {
        window.AndroidBridge.onSinglePointChanged(lat, lon);
      }
    };

    window.updateSimPosition = function(lat, lon, bearing) {
      if (!simMarker) {
        var icon = L.divIcon({
          className: 'sim-cursor-icon',
          html: `
            <div class="sim-pulse"></div>
            <div class="sim-cursor" id="sim-icon">
              <div class="sim-arrow" id="sim-arrow"></div>
            </div>
          `,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });
        simMarker = L.marker([lat, lon], { icon: icon, zIndexOffset: 2000 }).addTo(map);
      } else {
        simMarker.setLatLng([lat, lon]);
      }

      var arrow = document.getElementById('sim-arrow');
      if (arrow) {
        arrow.style.transform = `rotate(${bearing}deg)`;
      }

      if (isFollowing) {
        map.panTo([lat, lon], { animate: true, duration: 0.4 });
      }
    };

    window.stopSimPosition = function() {
      if (simMarker) {
        map.removeLayer(simMarker);
        simMarker = null;
      }
    };

    window.flyToLocation = function(lat, lon, zoom) {
      map.flyTo([lat, lon], zoom || 15);
    };

    window.onload = function() {
      initMap();
      if (window.AndroidBridge) {
        window.AndroidBridge.onMapReady();
      }
    };
  </script>
</body>
</html>
